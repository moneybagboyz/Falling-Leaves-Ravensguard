name: CI

on:
  push:
  pull_request:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  GODOT_VERSION: "4.7.2"
  GODOT_ZIP_SHA256: "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247" # Godot_v4.7.2-stable_mono_linux_x86_64.zip; update with GODOT_VERSION

jobs:
  build-test:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Ravensguard.slnx -c Release
      - name: Test
        run: dotnet test Ravensguard.slnx -c Release --no-build --logger "console;verbosity=normal"
      - name: Validate and bake art (sprites + rig)
        run: |
          dotnet run --project tools/Ravensguard.Art -c Release --no-build -- validate
          dotnet run --project tools/Ravensguard.Art -c Release --no-build -- bake --out art/out
          dotnet run --project tools/Ravensguard.Art -c Release --no-build -- rig --out art/out
      - name: Committed game art matches a fresh bake
        run: |
          tmp="$(mktemp -d)"
          dotnet run --project tools/Ravensguard.Art -c Release --no-build -- bake --out "$tmp/out" --out-game "$tmp/game"
          dotnet run --project tools/Ravensguard.Art -c Release --no-build -- rig --out "$tmp/out" --out-game "$tmp/game"
          # .import files are Godot-generated. PNGs are compared by decoded pixels (zlib output differs between machines); other files by bytes.
          dotnet run --project tools/Ravensguard.Art -c Release --no-build -- same "$tmp/game" src/Ravensguard.Game/assets/art \
            || { echo "::error::src/Ravensguard.Game/assets/art is out of date. Re-run 'bake --out-game' and 'rig --out-game' (see tools/Ravensguard.Art/README.md) and commit."; exit 1; }

  determinism:
    # Plan §5 Phase 1 done-when: the same seed gives the same continent, history, region (and people, chunks) on Windows and Linux.
    name: World hashes (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Generate world hashes
        shell: bash
        run: |
          dotnet build tools/Ravensguard.WorldTool -c Release
          dotnet run --project tools/Ravensguard.WorldTool -c Release --no-build -- hashes --seeds 1,1234 | tr -d '\r' > hashes-${{ matrix.os }}.txt
          cat hashes-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: hashes-${{ matrix.os }}.txt

  determinism-compare:
    name: Same world on Windows and Linux
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          merge-multiple: true
      - name: Compare
        run: |
          for f in hashes-ubuntu-latest.txt hashes-windows-latest.txt; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          done
          diff -u hashes-ubuntu-latest.txt hashes-windows-latest.txt \
            && echo "Windows and Linux generate identical worlds" \
            || { echo "::error::world hashes differ between Windows and Linux (determinism leak, plan §2.4)"; exit 1; }

  godot-smoke:
    name: Godot headless import and smoke boot
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Download Godot ${{ env.GODOT_VERSION }} (.NET)
        run: |
          curl -fsSL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          echo "${GODOT_ZIP_SHA256}  godot.zip" | sha256sum -c -
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Build game assembly
        run: dotnet build src/Ravensguard.Game/Ravensguard.Game.csproj -c Debug
      - name: Import
        working-directory: src/Ravensguard.Game
        run: timeout 300 "$GODOT" --headless --import
      - name: Smoke boot
        working-directory: src/Ravensguard.Game
        run: |
          # Boots MainMenu, SettingsScreen and StreetView and exits 1 on any captured engine/script error; the grep is a second net
          # in case an error is only printed.
          set +e
          timeout 120 "$GODOT" --headless -- --smoke 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          set -e
          if grep -E "ERROR|SCRIPT ERROR|Unhandled exception" smoke.log; then echo "::error::smoke run logged errors"; exit 1; fi
          exit $code
      - name: Crash handler (an exception thrown in a main-thread callback writes the crash report)
        working-directory: src/Ravensguard.Game
        run: timeout 60 "$GODOT" --headless -- --crash-test-callback
      - name: Key-map conflict check
        working-directory: src/Ravensguard.Game
        run: timeout 120 "$GODOT" --headless -- --check-keymap
      - name: Headless self-test (KeyMap, bindings, UI scale, street click, editor)
        working-directory: src/Ravensguard.Game
        run: |
          set +e
          timeout 120 "$GODOT" --headless -- --selftest 2>&1 | tee selftest.log
          code=${PIPESTATUS[0]}
          set -e
          if grep -E "ERROR|SCRIPT ERROR|Unhandled exception|FAILED" selftest.log; then echo "::error::selftest logged errors"; exit 1; fi
          exit $code
